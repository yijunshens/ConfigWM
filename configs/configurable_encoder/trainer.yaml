output_dir: ./outputs/configurable_encoder
do_train: true
do_eval: false
remove_unused_columns: false
shuffle_dataset: true
main_loss_weight: 0.0
same_source_contrastive_target_space: target_encoder
same_source_contrastive_pooling: patch_position
same_source_contrastive_patch_chunk_size: 16
gather_embeddings: true
accelerator_config:
  dispatch_batches: false
embedding_diagnostics_on_epoch_end: false
embedding_diagnostics_max_samples: 0
per_device_train_batch_size: 256
per_device_eval_batch_size: 128
gradient_accumulation_steps: 1
dataloader_num_workers: 1
dataloader_pin_memory: true
dataloader_persistent_workers: true
dataloader_drop_last: true
learning_rate: 5.0e-05
weight_decay: 0.05
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-08
max_grad_norm: 1.0
lr_scheduler_type: cosine
warmup_steps: 100
full_determinism: true
max_steps: -1
num_train_epochs: 1
save_strategy: "no"
logging_strategy: steps
logging_steps: 10
report_to: none
bf16: true
fp16: false
tf32: false
gradient_checkpointing: true
ignore_data_skip: false
